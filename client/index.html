<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Syntra</title>
    <link rel="icon" type="image/png" href="assets/images/syntra-symbol.png">

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="loading-screen">

        <div class="loading-content">

            <video
                class="loading-logo"
                autoplay
                muted
                playsinline
            >
                <source src="assets/videos/syntra-loading-screen.mp4" type="video/mp4">
            </video>

            <p id="loading-message"></p>

        </div>

    </div>

    <header>

        <div class="logo">
            <img
                src="assets/images/syntra-logo.png"
                alt="Syntra by SRS"
                class="syntra-logo"
            >
        </div>

        <nav>
            <a href="#" onclick="navigate('home');return false;">Home</a>
            <a href="#" onclick="navigate('albums');return false;">Albums</a>
            <a href="#" onclick="navigate('singles');return false;">Singles</a>
        </nav>

    </header>
    
    <div class="parallax-bg">
        <div class="parallax-image"></div>
    </div>

    <main id="app">

    </main>


    <footer class="player hidden" id="player"> <!-- Add "hidden" to hide the player initially -->

        <button id="expand-player" title="Click to Expand Player">
            <img src="assets/icons/chevron-up.svg" alt="Expand">
        </button>

        <div class="song">
            <img id="player-cover" class="player-cover" src="assets/images/default-cover.png">

            <div class="song-info">
                <div id="song-title-wrapper">
                    <h4 id="song-title" class="empty">Play a song</h4>
                </div>
                <p id="song-artist" class="empty">No song selected</p>
            </div>

            <button
                id="queue-button"
                title="View Queue"
                aria-label="View Queue"
            >
                <img
                    src="assets/icons/list-music.svg"
                    alt="Queue"
                >
            </button>
        </div>

        <div class="controls">

            <button id="repeat-button" title="Repeat (R)">
                <img id="repeat-icon" src="assets/icons/repeat-off.svg" alt="Repeat">
            </button>

            <button id="prev-button" title="Previous (P)">
                <img src="assets/icons/skip-back.svg" alt="Previous">
            </button>

            <button id="play-button" class="play-button-main" title="Play / Pause (Space)">
                <img id="play-icon" src="assets/icons/play.svg" alt="Play">
            </button>

            <button id="next-button" title="Next (N)">
                <img src="assets/icons/skip-forward.svg" alt="Next">
            </button>

        </div>

        <div class="right-controls">

            <div class="progress-container">
                <span id="current-time">0:00</span>

                <div id="seek-bar" title="Seek Bar (Click or Drag)">
                    <div id="seek-progress">
                        <div id="seek-thumb"></div>
                    </div>
                </div>

                <span id="duration">0:00</span>
            </div>

            <div class="volume-control" title="Volume Control (Click/Drag/Scroll)">

                <button id="mute-button" title="Mute / Unmute (M)">
                    <img
                        class="player-icon"
                        src="assets/icons/volume-2.svg"
                        alt="Volume">
                </button>

                <input
                    id="volume-slider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1">

            </div>

        </div>

        <audio id="syntra-audio"></audio>

    </footer>

    <div id="queue-overlay" class="queue-overlay">

        <div class="queue-panel">

            <div class="queue-header">
                <h3>Queue</h3>

                <button id="close-queue" title="Close Queue" aria-label="Close Queue">
                    ✕
                </button>
            </div>

            <div id="queue-list" class="queue-list"></div>

        </div>

    </div>

    <div id="alert-container"></div>

    <div class="expanded-player" id="expanded-player">

        <div class="expanded-bg"></div>

        <button id="close-player" title="Close Player">✕</button>

        <div class="expanded-main">

            <img id="expanded-cover" src="assets/images/default-cover.png">

            <h1 id="expanded-title">Play a song</h1>
            <h3 id="expanded-artist">No song selected</h3>

            <div class="expanded-controls">
                <div class="expanded-controls">

                    <button id="expanded-repeat" title="Repeat (R)">
                        <img id="expanded-repeat-icon" src="assets/icons/repeat-off.svg" alt="Repeat">
                    </button>

                    <button id="expanded-prev" title="Previous (P)">
                        <img src="assets/icons/skip-back.svg" alt="Previous">
                    </button>

                    <button id="expanded-play" class="play-button-main" title="Play / Pause (Space)">
                        <img id="expanded-play-icon" src="assets/icons/play.svg" alt="Play">
                    </button>

                    <button id="expanded-next" title="Next (N)">
                        <img src="assets/icons/skip-forward.svg" alt="Next">
                    </button>

                </div>
            </div>

            <div class="expanded-progress">

                <span id="expanded-current">0:00</span>

                <div id="expanded-seek-bar" title="Seek Bar (Click or Drag)">
                    <div id="expanded-seek-progress">
                        <div id="expanded-seek-thumb"></div>
                    </div>
                </div>

                <span id="expanded-duration">0:00</span>

            </div>

            <div class="expanded-volume">

                <button id="expanded-mute" title="Mute / Unmute (M)">
                    <img
                        class="player-icon"
                        src="assets/icons/volume-2.svg"
                    >
                </button>

                <input
                    id="expanded-volume-slider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                    title="Volume Control (Click/Drag/Scroll)"
                >

            </div>

            <div class="lyrics-section">

                <button id="lyrics-button" title="Show Lyrics">
                    <span>Lyrics</span>
                    <img src="assets/icons/chevron-up.svg" alt="arrow-lyrics">
                </button>

                <div class="lyrics-box" id="lyrics-box">

                    <div class="lyrics-content" id="lyrics-content">
                        <p>Lyrics unavailable</p>
                    </div>

                </div>

            </div>

        </div>


        <div class="expanded-details">

            <div class="credits">

                <h2>Credits</h2>

                <div class="credit-item">
                    <span>Artist</span>
                    <p id="credit-artist">-</p>
                </div>

                <div class="credit-item">
                    <span>Album</span>
                    <p id="credit-album">-</p>
                </div>

                <div class="credit-item">
                    <span>Year</span>
                    <p id="credit-year">-</p>
                </div>

                <div class="credit-item hidden" id="credit-link-item">
                    <span id="credit-link-label"></span>

                    <a
                        id="credit-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="hidden"
                    ></a>

                    <p id="credit-text" class="hidden"></p>
                </div>

            </div>


            <div class="fun-fact">

                <h2>Behind the Track</h2>

                <p id="expanded-funfact">-</p>

            </div>

        </div>

    </div>

    <!-- <div id="construction-dialog" class="construction-dialog hidden"> -->
    <!-- <div id="construction-dialog" class="construction-dialog">

        <div class="construction-dialog-content">

            <h2>Syntra is temporarily unavailable</h2>

            <p>
                We're making a few updates behind the scenes.
                Syntra will be back shortly.
                Please check back soon.
            </p>

            <button id="construction-dialog-close">
                Got it
            </button>

        </div>

    </div> -->

    <div id="server-dialog" class="server-dialog hidden">

        <div class="server-dialog-content">

            <h2 id="server-dialog-title">
                Server is currently offline
            </h2>

            <p id="server-dialog-message">
                Please refresh the app or try again later.
            </p>

            <button id="server-dialog-close">
                Got it
            </button>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/server-status.js"></script>
    <script src="js/startup.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/player.js"></script>
    <script src="js/lyrics.js"></script>
    <script src="js/router.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/parallax.js"></script>

</body>

</html>
