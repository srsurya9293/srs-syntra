<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Syntra Player Sandbox</title>

<link rel="stylesheet" href="css/testplayer.css">

</head>

<body>

<div class="player">

    <button id="repeat">
        <img id="repeat-icon"
        src="assets/icons/repeat-off.svg">
    </button>

    <button id="previous">
        <img src="assets/icons/skip-back.svg">
    </button>

    <button id="play" class="play">
        <img id="play-icon"
        src="assets/icons/play.svg">
    </button>

    <button id="next">
        <img src="assets/icons/skip-forward.svg">
    </button>

    <button id="volume">
        <img id="volume-icon"
        src="assets/icons/volume-2.svg">
    </button>

</div>

<script src="js/testplayer.js"></script>

</body>
</html>
